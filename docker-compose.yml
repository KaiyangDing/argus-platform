services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    # 基础设施端口只绑回环：局域网开放的入口只有 app 的 8000（ADR-016）
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U argus -d argus" ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    # arq 队列是业务状态（停机重排的 job 就在里面）：容器可弃、数据不可弃。
    # SIGTERM 时 Redis 按默认 save 点落 RDB 进卷，down/up 队列不丢；
    # 注意 down 别带 -v（删卷）。载荷键仍有 arq 自身 ~24h 过期为另一层界限。
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: argus
      MINIO_ROOT_PASSWORD: argusminio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 全栈形态（--profile full）：默认 up 仍只起三件套，host dev 不受影响 ----

  app:
    build: .
    profiles: [ "full" ]
    # 单副本口径：迁移放启动序（幂等），多副本时要抽独立 init job（ADR-016）
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ARGUS_DATABASE_URL: postgresql://argus:argus@postgres:5432/argus
      ARGUS_REDIS_URL: redis://redis:6379/0
      ARGUS_MINIO_ENDPOINT: minio:9000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)\"" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build: .
    profiles: [ "full" ]
    command: arq app.worker.WorkerSettings
    environment:
      ARGUS_DATABASE_URL: postgresql://argus:argus@postgres:5432/argus
      ARGUS_REDIS_URL: redis://redis:6379/0
      ARGUS_MINIO_ENDPOINT: minio:9000
    env_file: .env
    depends_on:
      # 等 app 健康 = 迁移已跑完，worker 不会踩到半新不旧的 schema
      app: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  redisdata:
