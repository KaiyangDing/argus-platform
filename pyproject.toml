[project]
name = "argus-platform"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastapi-limiter==0.1.6",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain-core>=1.5.5",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "minio>=7.2.20",
    "numpy>=2.5.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.16.1",
    "python-multipart>=0.0.32",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "locust>=2.46.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
